name: PR Description

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-description:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR description
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          body="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          trimmed_body="$(printf '%s' "$body" | tr -d '[:space:]')"

          if [ -z "$trimmed_body" ]; then
            echo "::error::Pull requests must include a description of what changed and why."
            exit 1
          fi

          default_template="$(gh api "repos/$REPO/contents/.github/pull_request_template.md?ref=$BASE_SHA" --jq '.content' | base64 --decode)"
          normalized_default_template="$(printf '%s' "$default_template" | tr -d '[:space:]')"
          legacy_default_template='##Summary##WalletsubmissionsIfthispullrequestaddsorupdatesawallet,filloutthewalletsubmissiontemplateinthePRdescriptionbeforerequestingreview:https://github.com/kaspamedia/kaspa-org/blob/main/.github/PULL_REQUEST_TEMPLATE/wallet-submission.mdWalletPRswithblankdescriptionsormissingwalletsubmissiondetailswillnotpassreview.'

          if [ "$trimmed_body" = "$normalized_default_template" ] || [ "$trimmed_body" = "$legacy_default_template" ]; then
            echo "::error::Pull request description still contains the untouched default template. Add a real summary before requesting review."
            exit 1
          fi

          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          touches_wallet_files=0

          while IFS= read -r file; do
            case "$file" in
              src/data/wallets.ts | public/hodl/wallets/*)
                touches_wallet_files=1
                break
                ;;
            esac
          done <<<"$files"

          if [ "$touches_wallet_files" -eq 0 ]; then
            echo "PR description is present. No wallet data or wallet icon changes detected."
            exit 0
          fi

          if grep -Eq '^- \[[xX]\] This PR changes wallet infrastructure only; it does not add or update any wallet record or icon\.[[:space:]]*$' <<<"$body"; then
            echo "Wallet infrastructure declaration confirmed. No wallet listing submission detected."
            exit 0
          fi

          missing=0
          for heading in \
            "# Wallet Submission" \
            "### Wallet name" \
            "### Official wallet page" \
            "### Wallet icon" \
            "### Change type" \
            "### Acceptance evidence" \
            "### Supported platforms" \
            "### User type" \
            "### Wallet summary" \
            "### Criteria ratings and evidence" \
            "### Features" \
            "### Acquisition actions" \
            "### Confirmation"
          do
            if ! grep -Fq "$heading" <<<"$body"; then
              echo "::error::Wallet submission PR description is missing required template section: $heading"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Fill out the wallet submission template in the PR description before requesting review."
            echo "Template: https://github.com/$REPO/blob/HEAD/.github/PULL_REQUEST_TEMPLATE/wallet-submission.md"
            exit 1
          fi

          wallet_template="$(gh api "repos/$REPO/contents/.github/PULL_REQUEST_TEMPLATE/wallet-submission.md?ref=$BASE_SHA" --jq '.content' | base64 --decode)"
          normalized_wallet_template="$(printf '%s' "$wallet_template" | tr -d '[:space:]')"

          if [ "$trimmed_body" = "$normalized_wallet_template" ]; then
            echo "::error::Wallet submission PR description still contains the untouched wallet template. Fill out the wallet details before requesting review."
            exit 1
          fi

          if ! grep -Eq '^- \[[xX]\] ' <<<"$body"; then
            echo "::error::Wallet submission PR description must check the applicable wallet submission boxes."
            exit 1
          fi

          echo "Wallet submission description includes the required template sections."
